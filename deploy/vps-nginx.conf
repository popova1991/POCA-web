# =========================================================
#  ПРИМЕР блока для VPS-nginx (уже установлен на сервере).
#
#  Параметры под замену:
#    - PORT     : порт, на котором запущен контейнер
#                 (команда запуска: docker run -p PORT:80 poca-web)
#    - /poca/   : внешний путь, по которому видно приложение
#
#  Куда положить: скопировать этот server-блок в
#  /etc/nginx/sites-enabled/ (или подключить include-ом),
#  затем:  nginx -t && systemctl reload nginx
# =========================================================

# Корень НЕ отдаёт приложение — прячем от ботов (без редиректа,
# иначе сканеры по 301 найдут /poca/ и смысл obscurity пропадёт).
server {
    listen 80;
    server_name example.com;   # <- подставить свой домен

    # Боты, бьющие в /, получают 444 и не узнают про /poca/
    location = / {
        return 444;
        # альтернатива, если не хочется обрывать соединение: return 404;
    }

    # Само приложение — только по этому пути.
    location /poca/ {
        proxy_pass http://127.0.0.1:8080/;   # <- PORT контейнера (со слэшом!)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
