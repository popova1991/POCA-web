# =========================================================
#  ФИНАЛЬНЫЙ конфиг для ВЫДЕЛЕННОГО домена speca-analyst.com
#  (отдельный сайт, независим от develop-bot-creator.ru).
#
#  Порядок:
#   1) открыть 80 и 443 порты в файерволе;
#   2) получить сертификат:
#      certbot certonly --webroot -w /var/www/html \
#        -d speca-analyst.com -d www.speca-analyst.com
#   3) положить ЭТОТ файл в /etc/nginx/sites-enabled/speca-app.conf
#   4) nginx -t && systemctl reload nginx
#
#  Пути сертификата — стандарт Let's Encrypt (менять не нужно).
#  Контейнер слушает 8080 -> proxy_pass http://127.0.0.1:8080/
# =========================================================

server {
    listen 80;
    server_name speca-analyst.com www.speca-analyst.com;

    access_log /var/log/nginx/speca-analyst.access.log;

    # Let's Encrypt (http-01 challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Весь остальной HTTP -> редирект на HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name speca-analyst.com www.speca-analyst.com;

    access_log /var/log/nginx/speca-analyst.access.log;

    ssl_certificate     /etc/letsencrypt/live/speca-analyst.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/speca-analyst.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # --- ХАНИПОТ-ЛОВУШКИ (fail2ban банит любого, кто сюда зайдёт) ---
    # Реальных таких страниц нет; их прощупывают только боты-сканеры.
    location = /administrator { return 403; }
    location = /_trap         { return 403; }

    location / {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
