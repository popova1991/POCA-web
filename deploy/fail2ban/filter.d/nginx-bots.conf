[Definition]
# Ловим типичные "дыры", которые прощупывают боты-сканеры.
# Работает на стандартном nginx combined-логе:
#   IP - - [time] "METHOD /path HTTP/1.1" status size "ref" "ua"
#
# Две группы: явные сигнатуры (wp-*, .env, .git, phpmyadmin...)
# и ханипот-ловушки (/administrator, /_trap).

failregex = ^<HOST> - \S+ \[[^\]]*\] "(?:GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH) [^"]*?\.(?:env|sql|git|pem|key|log|ini|bak|conf|sh|asp|aspx|jsp|sqlite)\b
            ^<HOST> - \S+ \[[^\]]*\] "(?:GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH) /(?:wp-login\.php|wp-admin|wp-content|xmlrpc\.php|phpmyadmin|pma|boaform|cgi-bin|actuator|shell\.php|test\.php|info\.php|phpMyAdmin)(?:[?\s]|$)
            ^<HOST> - \S+ \[[^\]]*\] "(?:GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH) /(?:\.git|\.env|\.aws|\.ssh|vendor|composer\.json|package\.json)(?:[?\s]|$)
            ^<HOST> - \S+ \[[^\]]*\] "(?:GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH) /(?:administrator|_trap)(?:[?\s]|$)

ignoreregex =
