[Definition]
# Ловим типичные "дыры", которые прощупывают боты-сканеры.
# Работает на стандартном nginx combined-логе:
#   IP - - [time] "METHOD /path HTTP/1.1" status size "ref" "ua"
#
# Группы: сигнатуры (wp-*, .env, .git, phpmyadmin...),
# cred-hunt сканеры, аctuator/spring, backup-файлы,
# и ханипот-ловушки (/administrator, /_trap).

# Backup-файлы и секреты по расширению
failregex = ^<HOST> - \S+ \[[^\]]*\] "(?:GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH) [^"]*?\.(?:env|sql|git|pem|key|log|ini|bak|conf|sh|asp|aspx|jsp|sqlite|swp|swo|save|old|orig|backup|dist|example)(?:~|\.swp|\.swo)?\b

# Известные сканерные пути (wp-*, phpmyadmin, actuator, ignite, cg-bin...)
            ^<HOST> - \S+ \[[^\]]*\] "(?:GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH) /(?:wp-login\.php|wp-admin|wp-content|xmlrpc\.php|phpmyadmin|pma|boaform|cgi-bin|shell\.php|test\.php|info\.php|phpMyAdmin)(?:[?\s]|$)
            ^<HOST> - \S+ \[[^\]]*\] "(?:GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH) /(?:\.git|\.env|\.aws|\.ssh|vendor|composer\.json|package\.json)(?:[?\s]|$)
            ^<HOST> - \S+ \[[^\]]*\] "(?:GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH) /(?:administrator|_trap)(?:[?\s]|$)

# Spring Boot Actuator, Ignition, Crusader и другие сканеры
            ^<HOST> - \S+ \[[^\]]*\] "(?:GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH) /actuator(?:/|\b)
            ^<HOST> - \S+ \[[^\]]*\] "(?:GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH) /_ignition(?:/|\b)
            ^<HOST> - \S+ \[[^\]]*\] "(?:GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH) /(?:env|crusader-404-probe)(?:[?\s]|$)

# Cred-hunt и подобные сканеры (пути)
            ^<HOST> - \S+ \[[^\]]*\] "(?:GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH) [^"]*(?:\.git-credentials|\.claude/|\.codex/|\.openclaw/|\.hermes/|\.local/share/opencode/|credentials\.json|auth\.json|\.env)(?:[?\s]|$)

# WordPress batch/v1 exploit и REST API сканирование
            ^<HOST> - \S+ \[[^\]]*\] "(?:GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH) /[^"]*wp-json/batch/v1
            ^<HOST> - \S+ \[[^\]]*\] "(?:GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH) /[^"]*rest_route=.*batch

# Бан по User-Agent (сканеры)
            ^<HOST> - \S+ \[[^\]]*\] "[^"]*" [234]\d\d \d+ "[^"]*" "[^"]*(?:opendirme-credhunt|credhunt|cred\.hunt|CredentialHunt|DirHunter|DirMen|crusader-worker)[^"]*"

ignoreregex =
