# Ханипот: мгновенный бан (maxretry=1) за заход в ловушки /administrator или /_trap.
# Реальных таких страниц нет — их прощупывают только сканеры.
[speca-honeypot]
enabled  = true
port     = http,https
filter   = nginx-bots
logpath  = /var/log/nginx/speca-analyst.access.log
maxretry = 1
findtime = 1h
bantime  = 30d
