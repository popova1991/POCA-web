# Сигнатурный бан: бот лезет в известные "дыры" (wp-*, .env, .git, phpmyadmin...).
# Живых пользователей не задевает — у приложения нет таких путей.
[speca-bots]
enabled  = true
port     = http,https
filter   = nginx-bots
logpath  = /var/log/nginx/speca-analyst.access.log
maxretry = 2
findtime = 10m
bantime  = 72h
